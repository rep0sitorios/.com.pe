<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d1118">
    <title>Dejar un recuerdo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- <link rel="stylesheet" href="css/flores-amarillas.css"> -->
</head>
<body>
    <main class="site-shell">
        <a class="page-back" href="index.html" aria-label="Volver al inicio">← Volver</a>
        <section class="memory-section guest-section">
            <div class="memory-heading">
                <p class="section-kicker">Para nosotros</p>
                <h1>Deja un<br><em>recuerdo.</em></h1>
                <p>Escribe algo y comparte una foto. Después de enviarlo, quedará guardado sin opción de editarlo desde esta página.</p>
            </div>
            <form class="memory-tools guest-form" id="guestForm">
                <label class="memory-field">
                    <span>Tu mensaje</span>
                    <textarea id="guestText" placeholder="Escribe aquí lo que sientes..." required></textarea>
                </label>
                <div class="memory-photo">
                    <span class="memory-label">Una foto especial</span>
                    <label class="photo-upload" for="guestPhotoInput">
                        <span class="upload-icon" aria-hidden="true">+</span>
                        <span id="guestPhotoLabel">Elegir una foto</span>
                    </label>
                    <input id="guestPhotoInput" type="file" accept="image/*" required>
                    <div class="photo-preview" id="guestPhotoPreview"></div>
                </div>
                <button class="button button-primary memory-save" type="submit">Enviar recuerdo <span aria-hidden="true">♥</span></button>
                <p class="memory-status" id="guestStatus" role="status"></p>
                <a class="button button-quiet" href="recuerdos.html">Ver recuerdos guardados</a>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/guest.js"></script>
</body>
</html>
